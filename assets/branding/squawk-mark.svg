<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="markAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <style>
    .sig-arc { fill: none; stroke: url(#markGrad); stroke-linecap: round; }
    .chevron { fill: url(#markGrad); }
    .beacon { fill: url(#markAmber); }
  </style>
  <!-- Outer Arc -->
  <path class="sig-arc" stroke-width="6" d="M 32,32 A 38,38 0 0,1 96,32" opacity="0.5" />
  <!-- Inner Arc -->
  <path class="sig-arc" stroke-width="7" d="M 44,46 A 24,24 0 0,1 84,46" opacity="0.9" />
  <!-- Vector Wing Chevron -->
  <path class="chevron" d="M 64,48 L 96,82 L 80,82 L 64,66 L 48,82 L 32,82 Z" />
  <!-- Beacon Dot -->
  <circle class="beacon" cx="64" cy="98" r="7" />
</svg>
